<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HGSS Map Randomizer Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1830;--bg2:#15233f;--card:#1a2a4a;--bd:#2f4470;--fg:#eaf0fb;--mut:#a3b3cf;--gold:#f2c14e;--silver:#cfd8e6;--ink:#1b1b1b}
@media(prefers-color-scheme:light){:root{--bg:#eef2f9;--bg2:#e1e9f5;--card:#fff;--bd:#c3d0e5;--fg:#15233f;--mut:#566b8d;--gold:#c98f1c;--silver:#6b7b95}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:16px/1.5 Figtree,system-ui,sans-serif;color:var(--fg);
background:radial-gradient(800px 380px at 92% -8%,rgba(242,193,78,.2),transparent),radial-gradient(800px 380px at 0% -8%,rgba(207,216,230,.16),transparent),var(--bg)}
header,main{max-width:860px;margin:0 auto;padding:16px 18px}
h1{font:800 clamp(28px,6vw,46px)/1.05 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:10px 0 6px}
.mut,small{color:var(--mut)}
code{font-size:12px;word-break:break-all}
.case{display:flex;flex-wrap:wrap;gap:10px;width:fit-content;max-width:100%;padding:14px 16px;margin:16px 0 8px;border:1px solid var(--bd);border-radius:20px;background:linear-gradient(135deg,rgba(242,193,78,.14),rgba(207,216,230,.1))}
.bd{width:30px;height:30px;border-radius:50%;border:2px dashed var(--bd);transition:box-shadow .4s,background .4s}
.bd.on{border:0;background:radial-gradient(circle at 35% 30%,hsl(var(--h) 95% 78%),hsl(var(--h) 75% 46%));box-shadow:0 0 14px hsl(var(--h) 90% 60%/.6)}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden;margin:8px 0 12px;max-width:420px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--silver),var(--gold))}
nav{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;margin:12px 0;background:var(--bg2);border:1px solid var(--bd);border-radius:999px}
nav button{border:0;background:none;border-radius:999px;padding:7px 16px;color:var(--mut);font:600 15px Figtree,sans-serif;cursor:pointer}
nav button.on{background:var(--gold);color:var(--ink)}
.btn,.go,#exp,#rst{display:inline-block;background:var(--gold);color:var(--ink);border:0;border-radius:12px;padding:9px 16px;font:700 15px Figtree,sans-serif;cursor:pointer}
#rst{background:var(--bg2);color:var(--fg);border:1px solid var(--bd)}
.nextup{background:linear-gradient(135deg,rgba(242,193,78,.2),rgba(207,216,230,.1)),var(--card);border:1px solid var(--gold);border-radius:24px;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.nextup h2{font:800 clamp(24px,5vw,32px)/1.1 "Bricolage Grotesque",system-ui,sans-serif;margin:4px 0 8px}
.route{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.chip{display:flex;flex-direction:column;min-width:0;max-width:100%;padding:8px 12px;font-weight:600;background:var(--bg2);border:1px solid var(--bd);border-radius:12px}
.chip small{font-weight:400;font-size:11px;word-break:break-all}
.chip.to{border-color:var(--gold)}
.arr{color:var(--gold);font-size:22px}
.go{margin-top:8px}
.sec{font:700 20px "Bricolage Grotesque",system-ui,sans-serif;margin:28px 0 6px}
.steps{margin-left:11px;padding-left:22px;border-left:2px solid var(--bd)}
.step{position:relative;padding:8px 0 10px}
.step label{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.step input{appearance:none;-webkit-appearance:none;position:absolute;left:-34px;top:9px;width:22px;height:22px;margin:0;border-radius:50%;border:2px solid var(--bd);background:var(--bg);cursor:pointer}
.step input:checked{background:var(--gold);border-color:var(--gold)}
.step input:checked::after{content:"✓";display:block;text-align:center;line-height:18px;font-size:14px;font-weight:700;color:var(--ink)}
.step.cur input{border-color:var(--gold)}
.step.done b{color:var(--mut);text-decoration:line-through}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin:8px 0}
.row{display:grid;grid-template-columns:24px 1fr 1fr;gap:10px;align-items:center}
@media(max-width:600px){.row{grid-template-columns:24px 1fr}.row input[type=text]{grid-column:1/-1}}
input[type=text],input[type=search]{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg2);color:var(--fg);font:inherit}
.warn{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;margin:10px 0}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:64px 20px;border:2px dashed var(--gold);border-radius:26px;background:rgba(242,193,78,.07);cursor:pointer}
.drop:hover{background:rgba(242,193,78,.14)}
.drop strong{font:800 clamp(22px,5vw,30px) "Bricolage Grotesque",system-ui,sans-serif}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>HGSS Map Randomizer Tracker</h1>
  <div class="mut">Upload your log and follow the route. Everything stays in your browser.</div>
  <div id="hero"></div>
  <label class="btn">Choose log file <input id="file" type="file" hidden></label> <span id="seed" class="mut"></span><br>
  <nav id="tabs"></nav>
</header>
<main id="main"><label class="drop" for="file"><strong>Drop your map log here</strong><span class="mut">or click to choose the file (*_map_randomized.log)</span></label></main>

<script>
/* [phase, goal, what to do, regex on original entrance IDs (null = not in the log)] */
const STEPS=[
["Johto","Get your starter","Elm's Lab. Not shuffled in the log.",null],
["Johto","Cherrygrove City","Route 29 to Cherrygrove.","ROUTE_29|R29_R46"],
["Johto","Mr. Pokémon's house","Get the Mystery Egg. Not shuffled in the log.",null],
["Johto","Sprout Tower","Violet City. Get Flash.","SPROUT_TOWER|VIOLET_SPROUT"],
["Johto","Violet Gym: Falkner","Zephyr Badge.","VIOLET_GYM"],
["Johto","Union Cave to Azalea","Routes 32 and 33.","ROUTE_3[23]_UNION|UNION_CAVE_R3[23]"],
["Johto","Slowpoke Well","Clear out Team Rocket.","SLOWPOKE_WELL"],
["Johto","Azalea Gym: Bugsy","Hive Badge.","AZALEA_GYM"],
["Johto","Ilex Forest","Get Cut and reach Goldenrod.","ILEX"],
["Johto","Goldenrod Gym: Whitney","Plain Badge.","GOLDENROD_GYM"],
["Johto","Flower Shop","Squirtbottle for Sudowoodo.","FLOWER_SHOP"],
["Johto","Route 36 gates","Sudowoodo, then on to Ecruteak.","R36|ROUTE_36"],
["Johto","Burned Tower","Ecruteak City.","BURNT_TOWER"],
["Johto","Ecruteak Gym: Morty","Fog Badge.","ECRUTEAK_GYM|ECURTEAK_GYM"],
["Johto","Dance Theater","Get Surf.","THEATER"],
["Johto","Moomoo Farm / Route 39","On the way to Olivine.","MOOMOO"],
["Johto","Olivine Lighthouse","Jasmine is at the top.","OLIVINE_LIGHTHOUSE|LIGHTHOUSE_OLIVINE|LIGHTHOUSE_EXTERIOR"],
["Johto","Cianwood Gym: Chuck","Storm Badge.","CIANWOOD_GYM"],
["Johto","Cianwood Pharmacy","SecretPotion for the Lighthouse.","PHARMACY"],
["Johto","Olivine Gym: Jasmine","Mineral Badge.","OLIVINE_GYM"],
["Johto","Mt. Mortar / Route 42","Get Strength, reach Mahogany.","MT_MORTAR_EXIT_R42|ROUTE_38_MT_MORTAR"],
["Johto","Lake of Rage","Red Gyarados.","LAKE_OF_RAGE|ROUTE_43"],
["Johto","Mahogany Rocket Hideout","Mahogany Town.","ROCKET_HIDEOUT_SHOP|MAHOGANY_ROCKET"],
["Johto","Goldenrod Radio Tower","Rocket takeover. You need the Basement Key.","GOLDENROD_RADIO_TOWER|RADIO_TOWER_GOLDENROD|GOLDENROD_UNDERGROUND|GOLDENROD_TUNNEL_ROCKET"],
["Johto","Mahogany Gym: Pryce","Glacier Badge.","MAHOGANY_GYM"],
["Johto","Ice Path","Route 44 to Blackthorn.","ICE_PATH_EXIT|ROUTE_44_ICE|BLACKTHORN_ICE_PATH"],
["Johto","Dragon's Den","Shrine trial.","DRAGONS_DEN|BLACKTHORN_DRAGONS"],
["Johto","Blackthorn Gym: Clair","Rising Badge.","BLACKTHORN_GYM"],
["Johto","Tohjo Falls / Route 27","Toward Victory Road.","TOHJO|ROUTE_27_TOHJO"],
["Johto","Victory Road","Reach the Indigo Plateau.","VICTORY_ROAD_EXIT|INDIGO_PLAT_VICTORY|INT_VICTORY_ROAD"],
["League","Will","","WILL_ROOM_ENT"],
["League","Koga","","KOGA_ROOM_ENT"],
["League","Bruno","","BRUNO_ROOM_ENT"],
["League","Karen","","KAREN_ROOM_ENT"],
["League","Champion Lance","","CHAMPION_ROOM_ENT"],
["Kanto","S.S. Aqua to Kanto","Boat from Olivine.","VERMILION_PORT|OLIVINE_PORT"],
["Kanto","Vermilion Gym: Lt. Surge","Thunder Badge.","VERMILION_GYM|VERMLIION_GYM"],
["Kanto","Saffron Gym: Sabrina","Marsh Badge.","SAFFRON_GYM"],
["Kanto","Celadon Gym: Erika","Rainbow Badge.","CELADON_GYM"],
["Kanto","Fuchsia Gym: Janine","Soul Badge.","FUCHSIA_GYM"],
["Kanto","Cerulean Gym: Misty","Cascade Badge.","CERULEAN_GYM"],
["Kanto","Pewter Gym: Brock","Boulder Badge.","PEWTER_GYM"],
["Kanto","Blaine's Gym (Seafoam)","Volcano Badge. The Gym is in Seafoam Islands.","SEAFOAM_GYM"],
["Kanto","Viridian Gym: Blue","Earth Badge.","VIRIDIAN_GYM"],
["Postgame","Mt. Silver: Red","","MT_SILVER_RED"],
["Postgame","Cerulean Cave: Mewtwo","","CERULEAN_CAVE_ENT"],
["Postgame","Bell Tower roof (Ho-Oh / Lugia)","Version-specific legendary.","BELL_TOWER_ROOF"],
["Postgame","Whirl Islands: Lugia chamber","Version-specific legendary.","WHIRL_ISLAND_LUGIA"]
];

const W={ENT:"Entrance",EXIT:"Exit",INT:"Interior",PC:"Pokémon Center",WIFI:"Wi-Fi",MT:"Mt.",DEPT:"Dept",TO:"to",
E:"East",W:"West",N:"North",S:"South",C:"Center",L:"Left",R:"Right",LEAUGE:"League",HOSUE:"House",FOERST:"Forest",
BURNT:"Burned",ECURTEAK:"Ecruteak",VERMLIION:"Vermilion",APT:"Apt",ALPH:"Ruins of Alph",DOWNSTAIRS:"Downstairs",UPSTAIRS:"Upstairs"};
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function pretty(id){const t=id.split("_"),o=[];
 for(let i=0;i<t.length;i++){const x=t[i];let m;
  if(x==="ROUTE"&&/^\d+$/.test(t[i+1]||"")){o.push("Route "+t[++i]);continue}
  if(m=x.match(/^R(\d+)$/))o.push("Route "+m[1]);
  else if(m=x.match(/^F(\d+)$/))o.push(m[1]+"F");
  else if(m=x.match(/^BF(\d+)$/))o.push("B"+m[1]+"F");
  else o.push(W[x]||x[0]+x.slice(1).toLowerCase());}
 return o.join(" ")}

let log=null,S={done:{},doors:{}},tab="walk",q="";
const $=s=>document.querySelector(s);

function parse(t){const conn={},ids=new Set();let seed="";
 t.split(/\r?\n/).forEach(l=>{l=l.trim();
  let m=l.match(/^seed\s*[:=]\s*(-?\d+)/i);if(m){seed=m[1];return}
  m=l.match(/([A-Za-z0-9_]+)\s*(?:<->|<=>|↔|=>|->)\s*([A-Za-z0-9_]+)/);if(!m)return;
  const a=m[1].toUpperCase(),b=m[2].toUpperCase();ids.add(a);ids.add(b);
  if(!conn[a])conn[a]=b;if(!conn[b])conn[b]=a;});
 return{seed,conn,ids:[...ids].sort()}}

const key=()=>"hgss:"+(log.seed||"noseed");
function load(){S={done:{},doors:{}};try{const r=JSON.parse(localStorage.getItem(key()));if(r){S=r;S.done=S.done||{};S.doors=S.doors||{}}}catch(e){}}
function save(){try{localStorage.setItem(key(),JSON.stringify(S))}catch(e){}}

function loadLog(text,remember){
 const p=parse(text);
 if(!p.ids.length){alert("No door pairs found. The log needs lines like  A <-> B");return}
 log=p;load();
 if(remember){try{localStorage.setItem("hgss:lastlog",text)}catch(e){}}
 $("#seed").textContent="Seed "+(p.seed||"unknown")+" · "+Math.round(Object.keys(p.conn).length/2)+" door pairs";
 render();}

function tabs(){$("#tabs").innerHTML=[["walk","Walkthrough"],["doors","All doors"],["save","Save / backup"]]
 .map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?"on":""}">${t[1]}</button>`).join("")}

function chips(id){return `<div class="route"><span class="chip">${E(pretty(id))}<small>${id}</small></span><span class="arr" aria-label="leads to">⟶</span><span class="chip to">${E(pretty(log.conn[id]))}<small>${log.conn[id]}</small></span></div>`}
function stepDoors(i){return STEPS[i][3]?log.ids.filter(id=>new RegExp(STEPS[i][3],"i").test(id)).slice(0,8):[]}
function badges(){
 const b=STEPS.map((s,i)=>[s,i]).filter(x=>/Gym/.test(x[0][1])&&/Johto|Kanto/.test(x[0][0]));
 const got=b.filter(x=>S.done[x[1]]).length,done=STEPS.filter((s,i)=>S.done[i]).length;
 $("#hero").innerHTML=`<div class="case" role="img" aria-label="Badge case: ${got} of ${b.length} badges">`+
  b.map((x,k)=>`<span class="bd${S.done[x[1]]?" on":""}" style="--h:${k*22}" title="${E(x[0][1])}"></span>`).join("")+
  `</div><div class="mut">${got} of ${b.length} badges, ${done} of ${STEPS.length} steps</div><div class="bar"><i style="width:${Math.round(done/STEPS.length*100)}%"></i></div>`}
function walk(){
 const nx=STEPS.findIndex((s,i)=>!S.done[i]);let h="";
 if(nx<0)h+=`<section class="nextup"><h2>Story complete</h2><p class="mut">Every step is ticked off.</p></section>`;
 else{const s=STEPS[nx],m=stepDoors(nx);
  h+=`<section class="nextup"><div class="mut">Go here next</div><h2>${E(s[1])}</h2>${s[2]?`<p>${E(s[2])}</p>`:""}`+
   (m.length?m.map(chips).join(""):`<p class="mut">${s[3]?"No matching door in this log.":"Not shuffled in the log, so the normal route applies."}</p>`)+
   `<button class="go" data-finish="${nx}">Mark done</button></section>`}
 h+=`<h3 class="sec">Full route</h3><div class="steps">`;
 STEPS.forEach((s,i)=>{h+=`<div class="step${S.done[i]?" done":""}${i===nx?" cur":""}"><label><input type="checkbox" data-step="${i}" ${S.done[i]?"checked":""}><span><b>${i+1}. ${E(s[1])}</b> <small>${s[0]}</small></span></label>`+
  (S.done[i]||i===nx?"":stepDoors(i).map(chips).join(""))+`</div>`});
 $("#main").innerHTML=h+"</div>";}

function doorList(){
 const f=q.trim().toLowerCase();
 const all=log.ids.filter(id=>!f||(id+" "+pretty(id)+" "+log.conn[id]+" "+pretty(log.conn[id])+" "+((S.doors[id]||{}).note||"")).toLowerCase().includes(f));
 const shown=all.slice(0,150);
 $("#list").innerHTML=shown.map(id=>{const d=S.doors[id]||{};
  return `<div class="card row"><input type="checkbox" data-door="${id}" ${d.v?"checked":""} title="Visited">
  <div><b>${E(pretty(id))}</b> <small>${id}</small><br>→ <b>${E(pretty(log.conn[id]))}</b> <small>${log.conn[id]}</small></div>
  <input type="text" data-note="${id}" placeholder="Notes (what you found there)" value="${E(d.note||"")}"></div>`}).join("")
  +(all.length>150?`<p class="mut">Showing 150 of ${all.length}. Type in the search box to narrow it.</p>`:"")
  +(all.length?"":`<p class="mut">No doors match.</p>`);}

function doors(){
 const v=Object.values(S.doors).filter(d=>d.v).length;
 $("#main").innerHTML=`<input type="search" id="q" placeholder="Search doors, towns or notes (e.g. violet gym)" value="${E(q)}">
 <p class="mut">${v} of ${log.ids.length} doors marked visited.</p><div id="list"></div>`;doorList();}

function savePane(){
 $("#main").innerHTML=`<div class="card"><b>Backup progress</b><p class="mut">Progress lives in this browser. Export a file to move it to another device.</p>
 <button id="exp">Export progress</button> <label class="btn">Import progress <input id="imp" type="file" accept=".json" hidden></label>
 <button id="rst">Reset this seed</button></div>
 <div class="warn"><b>Soft-lock note:</b> automatic save-safety checks are not in this version. Keep a backup of your .sav file or use emulator save states before key story events.</div>`;}

function render(){tabs();if(!log)return;badges();({walk,doors,save:savePane})[tab]();}

document.addEventListener("click",e=>{const t=e.target;
 if(t.dataset.tab){tab=t.dataset.tab;render()}
 if(t.dataset.finish!==undefined){S.done[t.dataset.finish]=true;save();render()}
 if(t.id==="exp"){const b=new Blob([JSON.stringify({seed:log.seed,S})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hgss-progress-"+(log.seed||"seed")+".json";a.click()}
 if(t.id==="rst"&&confirm("Erase all progress for this seed?")){S={done:{},doors:{}};save();render()}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="file"&&t.files[0]){const r=new FileReader();r.onload=()=>loadLog(r.result,true);r.readAsText(t.files[0])}
 if(t.id==="imp"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);S=j.S;S.done=S.done||{};S.doors=S.doors||{};save();alert("Progress imported.");tab="walk";render()}catch(x){alert("That is not a valid progress file.")}};r.readAsText(t.files[0])}
 if(t.dataset.step!==undefined){S.done[t.dataset.step]=t.checked;save();render()}
 if(t.dataset.door){(S.doors[t.dataset.door]=S.doors[t.dataset.door]||{}).v=t.checked;save()}});
document.addEventListener("input",e=>{const t=e.target;
 if(t.id==="q"){q=t.value;doorList()}
 if(t.dataset.note){(S.doors[t.dataset.note]=S.doors[t.dataset.note]||{}).note=t.value;save()}});

try{const last=localStorage.getItem("hgss:lastlog");if(last)loadLog(last,false)}catch(e){}
["dragover","drop"].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener("drop",e=>{const f=e.dataTransfer.files[0];if(f){const r=new FileReader();r.onload=()=>loadLog(r.result,true);r.readAsText(f)}});
</script>
</body>
</html>
